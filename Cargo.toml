[package]
name = "snow"
version = "0.4.0"
edition = "2024"

[dependencies]
anstyle = "1.0.10"
clap = { version = "4.5.27", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
env_logger = "0.11.6"
gethostname = "1.1.0"
indicatif = "0.18.6"
inquire = { version = "0.9.4" }
log = "0.4.25"
parking_lot = "0.12.5"
regex = "1.11.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
signal-hook = "0.3.18"
strum = { version = "0.26.3", features = ["derive"] }
users = "0.11.0"

[dev-dependencies]
testing_logger = "0.1.1"
